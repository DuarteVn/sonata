[workspace]
resolver = "3"
members = ["crates/core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/DuarteVn/sonata"

[workspace.dependencies]
sonata-core = { path = "crates/core" }
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
notify = "8.2"
notify-debouncer-full = "0.7"
portable-pty = "0.9"
pretty_assertions = "1"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-build = { version = "2.7", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
vt100 = "0.18"

[profile.release]
lto = "thin"
