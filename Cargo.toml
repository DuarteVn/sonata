[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "src-tauri"]

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/DuarteVn/sonata"

[workspace.dependencies]
sonata-core = { path = "crates/core" }
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
notify = "8.2"
notify-debouncer-full = "0.7"
png = "0.18"
portable-pty = "0.9"
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
quick-xml = "0.42"
pretty_assertions = "1"
rand = "0.9"
# Bug reports over HTTPS (feature 013, research R1). Same rustls + ring stack the updater
# already builds; `rustls-no-provider` avoids pulling aws-lc-rs.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "multipart", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["protocol-asset", "unstable", "devtools"] }
tauri-build = { version = "2.7", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tempfile = "3"
thiserror = "2"
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen"] }
tonic-prost = "0.14"
tokio-stream = "0.1"
tokio = { version = "1.54", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
vt100 = "0.18"
# Windows only: pipes, access lists, Job Objects, process snapshots (feature 012, research R2).
windows-sys = { version = "0.60", features = [
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
