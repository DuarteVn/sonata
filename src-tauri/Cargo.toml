[package]
name = "sonata-app"
description = "Sonata desktop shell (Tauri). Thin layer over sonata-core."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "sonata_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
sonata-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-updater.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

# Browser nodes: page snapshots and per-workspace data stores (feature 004, research R2/R6).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSError", "NSUUID", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "WKWebsiteDataStore", "block2", "objc2-app-kit"] }

# Browser node card pictures on Linux (feature 011, research R10). All three are already built
# through wry; these entries only make their APIs reachable.
[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = { version = "0.18", features = ["png"] }
gtk = "0.18"
webkit2gtk = "2.0"
